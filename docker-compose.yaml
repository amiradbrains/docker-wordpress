version: '3.1'

services:
  # Database
  db:
    image: mysql:5.7
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    networks:
      - wpNetwork

  # phpMyAdmin
  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin
    ports:
      - "80"
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: password
    networks:
      - wpNetwork

  # MailHog
  mailhog:
    image: mailhog/mailhog
    restart: always
    ports:
      - "1025"
      - "8025"
    networks:
      - wpNetwork

  # WordPress
  wordpress:
    depends_on:
      - db
      - mailhog
    image: wordpress:latest
    ports:
      - "80"
    restart: always
    volumes:
      - ./:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    networks:
      - wpNetwork

  # Node.js for Gutenberg Development 
  node:
    image: node:20 
    tty: true 
    stdin_open: true 
    volumes:
      - ./:/var/www/html
    command: tail -f /dev/null 
    networks:
      - wpNetwork

networks:
  wpNetwork:

volumes:
  db_data:
